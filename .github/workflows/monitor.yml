name: monitor-zelda
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: estado_alertas.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - run: pip install playwright requests && playwright install --with-deps chromium
      - run: python monitor_zelda.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
